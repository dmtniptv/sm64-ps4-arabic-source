name: Native cheats source validation

on:
  push:
    branches:
      - native-cheats-v2
    paths:
      - "tools/native_cheats_installer.py"
      - "tests/test_native_cheats_installer.py"
      - ".github/workflows/native-cheats-check.yml"
  workflow_dispatch:

jobs:
  verify-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m py_compile tools/native_cheats_installer.py tests/test_native_cheats_installer.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_native_cheats_installer.py" -v
